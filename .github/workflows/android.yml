name: Construire l'APK et l'AAB Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler l'APK (installation directe) et l'AAB (Google Play)
        run: gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Renommer les fichiers
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ocre-quest.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ocre-quest.aab

      - uses: actions/upload-artifact@v4
        with:
          name: ocre-quest
          path: |
            ocre-quest.apk
            ocre-quest.aab

      - name: Publier dans la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ocre-quest.apk ocre-quest.aab \
            --title "Ocre Quest – dernière version" \
            --notes "Construit automatiquement depuis le commit ${GITHUB_SHA::7}. ocre-quest.apk : à installer directement sur le téléphone. ocre-quest.aab : à envoyer sur Google Play Console."
